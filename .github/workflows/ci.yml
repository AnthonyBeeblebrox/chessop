# CI on the public repository (public spec §14, ADR 0007): every push of a branch or a tag runs
# the checks publish.sh ran before the release, from the locked dependencies, on the Python of
# .python-version. It never deploys: deploy.sh, run by hand, only asks whether the tag's run
# here was green.
name: CI

on: push

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON_PREFERENCE: only-managed  # uv's own CPython, as on the VPS, not the runner's
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.9"  # as provision.sh pins it on the VPS
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
