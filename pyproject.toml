[project]
name = "chessop"
version = "0.1.0"
description = "Drill chess openings against an opponent sampled from Lichess data"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "anthony fillion", email = "afillion0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pyrage>=1.4.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
build = ["zstandard>=0.25.0"]

[project.scripts]
chessop = "chessop:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
    "zstandard>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["prototype", "refs", ".scratch", "loop.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
replace-imports-with-any = ["pyrage"]  # a compiled module that ships no type stubs

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["slow: needs a real snapshot or takes seconds"]
